name: Build For Windows

on:
  workflow_call:

jobs:
  setup_metadata:
    uses: ./.github/workflows/setup_metadata.yml

  build:
    needs: setup_metadata
    runs-on: ${{ matrix.os }}

    strategy:
      # windows-arm64 is deliberately not built yet: it compiles and links (see
      # cmake/Dependencies.cmake, src/replication/librg_impl.c, cmake/shims) but
      # the real-UDP GnsTransport tests fail there, and this job feeds `bundle`.
      # Re-add `arm64` + the include below once they pass on windows-11-arm:
      #   - arch: arm64
      #     os: windows-11-arm
      #     cmake_arch_keyword: arm64
      #     vcpkg_triplet: arm64-windows
      matrix:
        target: [windows]
        arch: [x86_64]
        build_type: [release, debug]
        include:
          - build_type: release
            cmake_build_type_keyword: Release
          - build_type: debug
            cmake_build_type_keyword: RelWithDebInfo
          - arch: x86_64
            os: windows-latest
            cmake_arch_keyword: x64
            vcpkg_triplet: x64-windows

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@7315a94840631165970262a99c72cfb48a65d25d # v1.12.0
        with:
          arch: ${{ matrix.cmake_arch_keyword }}

      - name: Install protobuf (vcpkg, for GameNetworkingSockets)
        shell: cmd
        # windows-latest ships vcpkg pre-installed at %VCPKG_INSTALLATION_ROOT%.
        # protobuf's own CMake only emits a discoverable config as part of an
        # install step, so FetchContent-ing its source doesn't work (see
        # cmake/Dependencies.cmake) — a real package manager install is needed.
        run: "%VCPKG_INSTALLATION_ROOT%\\vcpkg install protobuf:${{ matrix.vcpkg_triplet }}"

      - name: Configure
        shell: cmd
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}\build" -G Ninja ^
            -DCMAKE_BUILD_TYPE="${{ matrix.cmake_build_type_keyword }}" ^
            -DVB_WARNINGS_AS_ERRORS=ON ^
            -DVB_HEADLESS=OFF ^
            -DVB_WITH_LUA=ON ^
            -DVB_WITH_NET=ON ^
            -DVB_WITH_REPLICATION=ON ^
            -DVB_WITH_COMPRESSION=ON ^
            -DVB_DISTRIBUTION=ON ^
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake

      - name: Build
        shell: cmd
        run: cmake --build "${{ github.workspace }}\build"

      - name: Test
        shell: cmd
        working-directory: build
        env:
          # Also exercise the real OS keychain (session store tests; opt-in so local runs never do).
          VB_TEST_REAL_KEYCHAIN: "1"
        run: ctest --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Package release archives
        shell: bash
        run: |
          python scripts/package_release.py \
            --build-dir "${{ github.workspace }}/build" \
            --out-dir "${{ github.workspace }}/dist" \
            --platform "${{ matrix.target }}-${{ matrix.arch }}" \
            --build-type "${{ matrix.build_type }}" \
            --version "${{ needs.setup_metadata.outputs.version }}"

      - name: Verify release binaries (no automation, asset sync built in)
        shell: bash
        run: |
          # The built binaries (what package_release.py zips). dist/ now holds only archives,
          # so checking it would silently test nothing.
          dist="${{ github.workspace }}/build"
          for exe in voxel_browser.exe voxel_browser_server.exe; do
            if "$dist/$exe" --version | grep -qi automation; then
              echo "::error::$exe was built with VB_WITH_AUTOMATION"; exit 1
            fi
            if ! "$dist/$exe" --version | grep -q '+asset-sync'; then
              echo "::error::$exe was built without VB_WITH_COMPRESSION (no asset sync)"; exit 1
            fi
            if "$dist/$exe" --automation stdio </dev/null >/dev/null 2>&1; then
              echo "::error::$exe accepted --automation"; exit 1
            fi
            # Not `--version`: that exits 0 before any flag is checked. These are one-shot if accepted.
            if "$dist/$exe" --net-sim lag_ms=1 --headless --frames 1 --ticks 1 </dev/null >/dev/null 2>&1; then
              echo "::error::$exe accepted --net-sim"; exit 1
            fi
            if "$dist/$exe" --automation tcp </dev/null >/dev/null 2>&1; then
              echo "::error::$exe accepted --automation tcp"; exit 1
            fi
            # Client-only flag (the server has no recorder and ignores it like any unknown flag).
            case "$exe" in
              voxel_browser|voxel_browser.exe)
                if "$dist/$exe" --automation-record /tmp/x.py --headless --frames 1 </dev/null >/dev/null 2>&1; then
                  echo "::error::$exe accepted --automation-record"; exit 1
                fi ;;
            esac
          done

      - name: Export archives
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup_metadata.outputs.project_name }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/dist/*.zip
          if-no-files-found: error
