name: Build For Linux

on:
  workflow_call:

jobs:
  setup_metadata:
    uses: ./.github/workflows/setup_metadata.yml

  build:
    needs: setup_metadata
    runs-on: ${{ matrix.os }}

    strategy:
      # A failing arm64 leg shouldn't cancel the x86_64 legs mid-build.
      fail-fast: false
      matrix:
        target: [linux]
        arch: [x86_64, arm64]
        build_type: [release, debug, asan, tsan]
        exclude:
          # Sanitizer coverage stays x86_64-only; arm64 is for release archives.
          - arch: arm64
            build_type: asan
          - arch: arm64
            build_type: tsan
        include:
          - build_type: release
            cmake_build_type_keyword: Release
            distribution_cmake_flags: -DVB_DISTRIBUTION=ON
          - build_type: debug
            cmake_build_type_keyword: RelWithDebInfo
            distribution_cmake_flags: -DVB_DISTRIBUTION=ON
          - build_type: asan
            cmake_build_type_keyword: RelWithDebInfo
            sanitizer_cmake_flags: -DVB_ENABLE_ASAN=ON -DVB_ENABLE_UBSAN=ON
          - build_type: tsan
            cmake_build_type_keyword: RelWithDebInfo
            sanitizer_cmake_flags: -DVB_ENABLE_TSAN=ON
          - arch: x86_64
            os: ubuntu-latest
            cxxflags: -m64
          - arch: arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          # raylib needs X11/GL headers; GameNetworkingSockets (Phase 1.2)
          # needs protobuf + OpenSSL (its default crypto backend on Linux).
          sudo apt-get install -y \
            ninja-build cmake build-essential \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libssl-dev libprotobuf-dev protobuf-compiler \
            libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.cmake_build_type_keyword }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DVB_WARNINGS_AS_ERRORS=ON \
            -DVB_HEADLESS=OFF \
            -DVB_WITH_LUA=ON \
            -DVB_WITH_NET=ON \
            -DVB_WITH_REPLICATION=ON \
            -DVB_WITH_COMPRESSION=ON \
            ${{ matrix.sanitizer_cmake_flags }} \
            ${{ matrix.distribution_cmake_flags }}

      - name: Build
        shell: bash
        run: cmake --build "${{ github.workspace }}/build"

      - name: Test
        shell: bash
        working-directory: build
        env:
          # See cmake/tsan.supp's own comment: GameNetworkingSockets is
          # never compiled with -fsanitize=thread, so TSan false-positives
          # on its internal locking/message-buffer access. Harmless (and
          # unused) for the other build_type legs.
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/tsan.supp
        run: ctest --output-on-failure

      # The Secret Service keychain backend (libsecret, dlopen'ed) against a real gnome-keyring on a
      # private session bus. One leg is enough: the code is the same on every Linux.
      - name: Test the Secret Service keychain
        if: matrix.build_type == 'debug' && matrix.arch == 'x86_64'
        shell: bash
        working-directory: build
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0
          dbus-run-session -- sh -c 'echo ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
            VB_TEST_REAL_KEYCHAIN=1 ./vb_tests --test-case="*platform keychain*"'

      - name: Set up Python
        if: matrix.build_type == 'release' || matrix.build_type == 'debug'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Package release archives
        if: matrix.build_type == 'release' || matrix.build_type == 'debug'
        shell: bash
        run: |
          python scripts/package_release.py \
            --build-dir "${{ github.workspace }}/build" \
            --out-dir "${{ github.workspace }}/dist" \
            --platform "${{ matrix.target }}-${{ matrix.arch }}" \
            --build-type "${{ matrix.build_type }}" \
            --version "${{ needs.setup_metadata.outputs.version }}"

      - name: Verify release binaries (no automation, asset sync built in)
        if: matrix.build_type == 'release' || matrix.build_type == 'debug'
        shell: bash
        run: |
          # The built binaries (what package_release.py zips). dist/ now holds only archives,
          # so checking it would silently test nothing.
          dist="${{ github.workspace }}/build"
          for exe in voxel_browser voxel_browser_server; do
            if "$dist/$exe" --version | grep -qi automation; then
              echo "::error::$exe was built with VB_WITH_AUTOMATION"; exit 1
            fi
            if ! "$dist/$exe" --version | grep -q '+asset-sync'; then
              echo "::error::$exe was built without VB_WITH_COMPRESSION (no asset sync)"; exit 1
            fi
            if "$dist/$exe" --automation stdio </dev/null >/dev/null 2>&1; then
              echo "::error::$exe accepted --automation"; exit 1
            fi
            # Not `--version`: that exits 0 before any flag is checked. These are one-shot if accepted.
            if "$dist/$exe" --net-sim lag_ms=1 --headless --frames 1 --ticks 1 </dev/null >/dev/null 2>&1; then
              echo "::error::$exe accepted --net-sim"; exit 1
            fi
            if "$dist/$exe" --automation tcp </dev/null >/dev/null 2>&1; then
              echo "::error::$exe accepted --automation tcp"; exit 1
            fi
            # Client-only flag (the server has no recorder and ignores it like any unknown flag).
            case "$exe" in
              voxel_browser|voxel_browser.exe)
                if "$dist/$exe" --automation-record /tmp/x.py --headless --frames 1 </dev/null >/dev/null 2>&1; then
                  echo "::error::$exe accepted --automation-record"; exit 1
                fi
                if "$dist/$exe" --auth-token-file /tmp/x.txt --headless --frames 1 </dev/null >/dev/null 2>&1; then
                  echo "::error::$exe accepted --auth-token-file"; exit 1
                fi ;;
            esac
          done

      - name: Export archives
        if: matrix.build_type == 'release' || matrix.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup_metadata.outputs.project_name }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/dist/*.zip
          if-no-files-found: error

  # End-to-end multiplayer tests (docs/e2e-automation.md §8): real client + server
  # processes driven over the development-only automation channel. This is the only job
  # that builds with VB_WITH_AUTOMATION=ON; it never stages or uploads binaries, and its
  # failure-log artifact is deliberately NOT named "<project>-*" so bundle.yml's merge
  # pattern can't sweep it into a release.
  e2e:
    runs-on: ubuntu-latest
    # An ASan build of everything plus a real client/server run is slow; a hung test must not
    # sit for the 6-hour default (the e2e CTest entry has its own 15-minute TIMEOUT).
    timeout-minutes: 75
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # A known interpreter with a working pip (Ubuntu 24.04's system pip refuses to install
      # without a venv, PEP 668). CMake must find *this* python, so it goes first.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake build-essential \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libssl-dev libprotobuf-dev protobuf-compiler \
            xvfb libgl1-mesa-dri
          python3 -m pip install -r tests/e2e/requirements.txt

      # ASan + UBSan: real two-process shutdown is exactly where leaks and teardown
      # bugs show up. NET/LUA/COMPRESSION: a real UDP server, the base pack's
      # mechanics and UI, and asset sync (how clients receive the pack's UI scripts).
      # CLI: test_pack_dev.py drives the real `vb pack dev` against this build.
      - name: Configure
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVB_WARNINGS_AS_ERRORS=ON \
            -DVB_HEADLESS=OFF \
            -DVB_WITH_LUA=ON \
            -DVB_WITH_NET=ON \
            -DVB_WITH_REPLICATION=ON \
            -DVB_WITH_COMPRESSION=ON \
            -DVB_WITH_AUTOMATION=ON \
            -DVB_BUILD_CLI=ON \
            -DVB_ENABLE_ASAN=ON -DVB_ENABLE_UBSAN=ON

      # CMake silently skips registering the e2e test when its python can't import pytest. A
      # green run that executed no e2e tests is worse than a red one, so insist it is there.
      - name: Verify the e2e test is registered
        shell: bash
        working-directory: build
        run: |
          ctest -N -L e2e
          ctest -N -L e2e | grep -q "Total Tests: 1" || {
            echo "::error::the e2e CTest entry was not registered (can the python CMake found import pytest?)"; exit 1; }

      - name: Build
        shell: bash
        run: cmake --build "${{ github.workspace }}/build"

      # The whole suite, not just `-L e2e`: it also runs the automation-on unit tests.
      # Under Xvfb (software GL) so the windowed tests -- real window, menu, screenshots --
      # run too; without a display they skip themselves.
      - name: Test
        shell: bash
        working-directory: build
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --output-on-failure

      - name: Upload e2e failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: ${{ github.workspace }}/build/e2e-artifacts
          if-no-files-found: ignore

  # libFuzzer runs of tests/fuzz/ (protocol decoders, chunk codec, LZ4, ID tokens, JWKS, the
  # loopback sign-in listener). Every other leg already replays the seeds and regressions plus
  # deterministic mutations through ctest; this one lets coverage-guided fuzzing look for new
  # inputs for a fixed time per target. A crash fails the job and uploads the input -- add it to
  # tests/fuzz/regressions/<target>/ with the fix.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang libclang-rt-dev libssl-dev libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVB_WARNINGS_AS_ERRORS=ON \
            -DVB_BUILD_FUZZERS=ON \
            -DVB_BUILD_CLIENT=OFF -DVB_BUILD_SERVER=OFF -DVB_BUILD_CLI=OFF -DVB_BUILD_EDITOR=OFF \
            -DVB_WITH_LUA=OFF -DVB_WITH_COMPRESSION=ON -DVB_WITH_AUTH=ON

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --target \
            fuzz_protocol fuzz_protocol_replay fuzz_auth fuzz_auth_replay

      - name: Fuzz
        shell: bash
        working-directory: build
        run: |
          for t in protocol auth; do
            mkdir -p "corpus/$t" crashes
            "./fuzz_${t}_replay" --write-seeds "corpus/$t"
            cp "${{ github.workspace }}/tests/fuzz/regressions/$t/"* "corpus/$t/" 2>/dev/null || true
            "./fuzz_$t" "corpus/$t" -max_total_time=180 -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix="crashes/$t-" -print_final_stats=1
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: ${{ github.workspace }}/build/crashes
          if-no-files-found: ignore
